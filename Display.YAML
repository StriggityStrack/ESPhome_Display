esphome:
  name: #your name
  friendly_name: #your name

esp32:
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    advanced:
       execute_from_psram: true

psram:
  mode: octal
  speed: 80MHz

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: #your key

ota:
  - platform: esphome
    password: #your password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: #your ssid
    password: #your password

captive_portal:

# --------------------------------
# RGB LCD Parallel Display
# --------------------------------

# waveshare 7” ESP32-S3N8R8 Capacitive Touch Display 1024×600
# 512KB SRAM and 384KB ROM, with onboard 16MB Flash and 8MB PSRAM
# https://www.waveshare.com/esp32-s3-lcd-7b.htm
# Hardware configuration file

preferences:
  flash_write_interval: 5min

#-------------------------------------------
# IO Extender
#-------------------------------------------

external_components:
  - source: github://pr#10071
    components: [waveshare_io_ch32v003]
    refresh: 1h

waveshare_io_ch32v003:
  - id: waveshare_io_hub

#-------------------------------------------
# LCD Back light
#-------------------------------------------

output:
  - platform: waveshare_io_ch32v003
    id: backlight_output

  - platform: waveshare_io_ch32v003
    id: pwm_backlight_output
    inverted: true
    min_power: 0.03
    max_power: 1.0

switch:
  - platform: gpio
    internal: True
    id: exio2
    restore_mode: ALWAYS_ON
    pin: 
      waveshare_io_ch32v003: waveshare_io_hub
      number: 2
      mode: 
        output: true

light:
  - platform: monochromatic
    output: pwm_backlight_output
    name: Display Backlight
    icon: mdi:lightbulb-on
    id: display_backlight
    restore_mode: ALWAYS_ON
    default_transition_length: 0ms
    on_turn_on: 
      then:
        - switch.turn_on: exio2
    on_turn_off: 
      then:
        - switch.turn_off: exio2      

#-------------------------------------------
# GPIO Button
#-------------------------------------------

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO6
      mode: INPUT_PULLUP
      inverted: true
    name: "Display Button"
    on_press:
      - light.toggle: display_backlight #toggles backlight

#-------------------------------------------
# Touchscreen gt911
#-------------------------------------------

i2c:
  - id: bus_a
    sda: GPIO08
    scl: GPIO09
    scan: true

touchscreen:
  platform: gt911
  id: my_touchscreen
  display: my_display
  i2c_id: bus_a
  interrupt_pin: GPIO4
  reset_pin:
    waveshare_io_ch32v003: waveshare_io_hub
    number: 1
    mode: OUTPUT
  # on_touch:
    # - lambda: |-
        # ESP_LOGI("Touch", "Touch detected at x=%d, y=%d", touch.x, touch.y);
  # on_update:
    # - lambda: |-
          # for (auto touch: touches)  {
              # if (touch.state <= 2) {
                # ESP_LOGI("Touch points:", "id=%d x=%d, y=%d x.raw=%d, y.raw=%d", touch.id, touch.x, touch.y, touch.x_raw, touch.y_raw);
              # }
          # }

#-------------------------------------------
# Display
#-------------------------------------------

display:
  - platform: rpi_dpi_rgb
    id: my_display
    update_interval: never
    auto_clear_enabled: false
    color_order: RGB
    pclk_frequency: 30MHZ
    dimensions:
      width: 1024
      height: 600
    de_pin:
      number: 5
    hsync_pin:
      number: 46
      ignore_strapping_warning: true
    vsync_pin:
      number: 3
      ignore_strapping_warning: true
    pclk_pin: 7
    pclk_inverted: true
    reset_pin:
      waveshare_io_ch32v003: waveshare_io_hub
      number: 3
    hsync_back_porch: 152
    hsync_front_porch: 48
    hsync_pulse_width: 162
    vsync_back_porch: 13
    vsync_front_porch: 3
    vsync_pulse_width: 45
    data_pins:
      red:
        - 1         #red3
        - 2         #red4
        - 42        #red5
        - 41        #red6
        - 40        #red7
      blue:
        - 14        #blue3
        - 38        #blue4
        - 18        #blue5
        - 17        #blue6
        - 10        #blue7
      green:
        - 39        #green2
        - 0         #green3
        - 45        #green4
        - 48        #green5
        - 47        #green6
        - 21        #green7

#-------------------------------------------
# Home_Assistant Input
#-------------------------------------------

time:
  - platform: homeassistant
    id: esptime

sensor:
  - platform: homeassistant
    id: Total_Power
    entity_id: sensor.total_power
    on_value:
      then:
        - lvgl.label.update:
            id: power_label
            text:
              format: "%.0fW"
              args: [ 'x' ]
  - platform: homeassistant
    id: Power_L1
    entity_id: sensor.power_l1
    on_value:
      then:
        - lvgl.bar.update:
            id: power_bar_l1
            value: !lambda 'return x;'
            anim_time: 5s
  - platform: homeassistant
    id: Power_L2
    entity_id: sensor.power_l2
    on_value:
      then:
        - lvgl.bar.update:
            id: power_bar_l2
            value: !lambda 'return x;'
            anim_time: 5s

text_sensor:
  - platform: homeassistant
    id: #your alarm id
    entity_id: alarm_control_panel.#your alarm
    on_value: 
      then:
        - lambda: |-
            if (x == "disarmed") {
              lv_obj_set_style_opa(id(lock_image_result), 0, 0);
            } else {
              lv_obj_set_style_opa(id(lock_image_result), 255, 0);
            }
  - platform: homeassistant
    id: garage_door_state
    entity_id: sensor.garage_door_state
    on_value:
      then:
        - lambda: |-
            if (id(garage_door_state).state == "Closed") {
              lv_obj_set_style_opa(id(Button_4), 0, 0);
            } else {
              lv_obj_set_style_opa(id(Button_4), 128, 0);
            }

#-------------------------------------------
# Program
# https://esphome.io/components/lvgl/
#-------------------------------------------

interval:
  - interval: 1s
    then:
      # Update Hours
      - lvgl.label.update:
          id: hours_label
          text:
            time_format: "%I" # 24-hour format (use %I for 12-hour)
            time: !lambda "return id(esptime).now();"
            
      # Update Minutes
      - lvgl.label.update:
          id: minutes_label
          text:
            time_format: "%M"
            time: !lambda "return id(esptime).now();"
            
      # Update Seconds
      - lvgl.label.update:
          id: seconds_label
          text:
            time_format: "%S"
            time: !lambda "return id(esptime).now();"

